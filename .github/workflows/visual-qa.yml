name: Orbit Visual QA

on:
  push:
    branches:
      - qa/simulator-visual-validation
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: [small, standard, large]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select iPhone for role
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/devices.json

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os

          role = os.environ["ROLE"]
          data = json.load(open("/tmp/devices.json"))
          devices = []
          for runtime_devices in data["devices"].values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      devices.append((device["name"], device["udid"]))

          by_name = {}
          for name, udid in devices:
              by_name.setdefault(name, udid)

          preferences = {
              "small": [
                  "iPhone SE (3rd generation)",
                  "iPhone SE (2nd generation)",
                  "iPhone 13 mini"
              ],
              "standard": [
                  "iPhone 16",
                  "iPhone 15",
                  "iPhone 16 Pro",
                  "iPhone 15 Pro"
              ],
              "large": [
                  "iPhone 16 Pro Max",
                  "iPhone 15 Pro Max",
                  "iPhone 14 Pro Max"
              ]
          }

          selected = None
          for name in preferences[role]:
              if name in by_name:
                  selected = (name, by_name[name])
                  break

          if selected is None:
              selected = devices[0]

          print(f"DEVICE_NAME={selected[0]}")
          print(f"DEVICE_UDID={selected[1]}")
          PY

      - name: Build Debug app for Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$(find "$PWD/DerivedData/Build/Products" -path '*Debug-iphonesimulator/Orbit.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Orbit.app not found" >&2
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Capture real SwiftUI screens
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail

          mkdir -p "visual-qa/$ROLE"
          BUNDLE_ID="com.dantopspin.orbitremote"

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl ui "$DEVICE_UDID" appearance light || true
          xcrun simctl status_bar "$DEVICE_UDID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4 || true
          xcrun simctl privacy "$DEVICE_UDID" grant local-network "$BUNDLE_ID" || true

          CORE=(onboarding no-tv remote paywall settings)
          EXTRA=(keyboard pairing apps devices discovery)

          capture() {
            local screen="$1"
            local appearance="$2"

            xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" \
              -orbitVisualQA "$screen" >/dev/null

            case "$screen" in
              discovery) sleep 6 ;;
              paywall|apps) sleep 3 ;;
              *) sleep 1.5 ;;
            esac

            xcrun simctl io "$DEVICE_UDID" screenshot \
              "visual-qa/$ROLE/${screen}-${appearance}.png"
          }

          for screen in "${CORE[@]}"; do
            capture "$screen" light
          done

          if [ "$ROLE" = "standard" ]; then
            for screen in "${EXTRA[@]}"; do
              capture "$screen" light
            done

            xcrun simctl ui "$DEVICE_UDID" appearance dark || true
            for screen in onboarding no-tv remote paywall settings; do
              capture "$screen" dark
            done
          fi

          echo "$DEVICE_NAME" > "visual-qa/$ROLE/device.txt"
          xcrun simctl shutdown "$DEVICE_UDID" || true

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: orbit-visual-qa-${{ matrix.role }}
          path: visual-qa/${{ matrix.role }}/
          if-no-files-found: error
          retention-days: 7
