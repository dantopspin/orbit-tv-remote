name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
            python3 -c '
import json
import sys

payload = json.load(sys.stdin)
for devices in payload.get("devices", {}).values():
    for device in devices:
        if (
            device.get("isAvailable")
            and device.get("name", "").startswith("iPhone")
        ):
            print(device["udid"])
            raise SystemExit(0)

raise SystemExit("No available iPhone simulator found")
'
          )"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Using simulator $SIMULATOR_ID"

      - name: Build Orbit for testing
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run Orbit unit tests
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          test-without-building

      - name: Build Orbit Release
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
