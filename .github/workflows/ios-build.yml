name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            git ls-files |
            grep -E '(^|/)(\.env($|\.)|Secrets\.xcconfig$|.*\.secrets\.xcconfig$|.*\.(p12|mobileprovision|provisionprofile|pem|key)$)' ||
            true
          )"

          if [ -n "$forbidden_files" ]; then
            echo "Forbidden secret/signing files are tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "OpenAI-style key": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "Google API key": re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              "Slack token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
              "Stripe secret": re.compile(r"\bsk_(?:live|test)_[A-Za-z0-9]{16,}\b"),
              "Private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }

          text_extensions = {
              ".swift", ".md", ".yml", ".yaml", ".json",
              ".plist", ".xml", ".xcconfig", ".pbxproj",
              ".xcscheme", ".txt"
          }

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True
          ).splitlines()

          findings = []

          for raw_path in tracked:
              path = pathlib.Path(raw_path)

              if path.suffix.lower() not in text_extensions:
                  continue

              try:
                  text = path.read_text(
                      encoding="utf-8"
                  )
              except (UnicodeDecodeError, OSError):
                  continue

              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(
                          f"{raw_path}: {label}"
                      )

          if findings:
              print(
                  "Potential committed secrets found:",
                  file=sys.stderr
              )
              for finding in findings:
                  print(
                      f"  - {finding}",
                      file=sys.stderr
                  )
              sys.exit(1)

          history_patterns = [
              r"sk-[A-Za-z0-9_-]{20,}",
              r"AIza[0-9A-Za-z_-]{30,}",
              r"AKIA[0-9A-Z]{16}",
              r"gh[pousr]_[A-Za-z0-9]{30,}",
              r"xox[baprs]-[A-Za-z0-9-]{20,}",
              r"sk_(live|test)_[A-Za-z0-9]{16,}",
              r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----",
          ]

          history_regex = "|".join(
              f"({pattern})"
              for pattern in history_patterns
          )

          commits = subprocess.check_output(
              ["git", "rev-list", "--all"],
              text=True
          ).splitlines()

          history_findings = []

          for commit in commits:
              result = subprocess.run(
                  [
                      "git",
                      "grep",
                      "-I",
                      "-n",
                      "-E",
                      history_regex,
                      commit,
                  ],
                  text=True,
                  capture_output=True,
              )

              if result.returncode not in (0, 1):
                  print(
                      result.stderr,
                      file=sys.stderr
                  )
                  sys.exit(result.returncode)

              if result.stdout.strip():
                  history_findings.append(
                      result.stdout.strip()
                  )

          if history_findings:
              print(
                  "Potential secrets found in Git history:",
                  file=sys.stderr
              )
              for finding in history_findings:
                  print(
                      finding,
                      file=sys.stderr
                  )
              sys.exit(1)

          print(
              f"No forbidden secret patterns found in current tree or {len(commits)} commit(s)."
          )
          PY

      - name: Validate app icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          import zlib

          path = "Orbit/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          data = open(path, "rb").read()
          assert data.startswith(b"\x89PNG\r\n\x1a\n")

          offset = 8
          idat = bytearray()
          saw_iend = False
          width = height = bit_depth = color_type = None

          while offset < len(data):
              if offset + 12 > len(data):
                  raise AssertionError("truncated PNG chunk header")

              length = struct.unpack(">I", data[offset:offset + 4])[0]
              kind = data[offset + 4:offset + 8]
              payload_start = offset + 8
              payload_end = payload_start + length
              crc_end = payload_end + 4

              if crc_end > len(data):
                  raise AssertionError(f"truncated {kind!r} chunk")

              payload = data[payload_start:payload_end]
              expected_crc = struct.unpack(
                  ">I",
                  data[payload_end:crc_end]
              )[0]
              actual_crc = zlib.crc32(kind + payload) & 0xFFFFFFFF
              assert actual_crc == expected_crc, f"bad CRC for {kind!r}"

              if kind == b"IHDR":
                  (
                      width,
                      height,
                      bit_depth,
                      color_type,
                      compression,
                      filter_method,
                      interlace
                  ) = struct.unpack(">IIBBBBB", payload)

                  assert width == 1024
                  assert height == 1024
                  assert bit_depth == 8
                  assert color_type == 2, "app icon must be truecolor RGB without alpha"
                  assert compression == 0
                  assert filter_method == 0
                  assert interlace in (0, 1)

              elif kind == b"IDAT":
                  idat.extend(payload)

              elif kind == b"IEND":
                  saw_iend = True
                  break

              offset = crc_end

          assert saw_iend, "missing IEND"
          assert idat, "missing IDAT"
          zlib.decompress(bytes(idat))
          assert width == 1024 and height == 1024

          print(
              f"Validated RGB PNG: {width}x{height}, "
              f"{len(data)} bytes"
          )
          PY

      - name: Select available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Using simulator $SIMULATOR_ID"

      - name: Build Orbit for testing
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run Orbit unit tests
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          test-without-building

      - name: Build Orbit Release
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
