name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate app icon
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          path = "Orbit/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          image = Image.open(path)
          image.load()
          assert image.size == (1024, 1024), image.size
          assert image.mode == "RGB", image.mode
          print("Validated", path, image.mode, image.size)
          PY

      - name: Select available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Using simulator $SIMULATOR_ID"

      - name: Build Orbit for testing
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run Orbit unit tests
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          test-without-building

      - name: Build Orbit Release
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
