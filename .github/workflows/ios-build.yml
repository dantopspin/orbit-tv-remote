name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate app icon
        shell: bash
        run: |
          set -euo pipefail
          ICON="Orbit/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          DECODED="/tmp/orbit-app-icon-decoded.png"

          # Force a full decode. Reading PNG metadata alone can succeed on a
          # truncated IDAT stream, which previously let a corrupt icon pass CI.
          sips -s format png "$ICON" --out "$DECODED" >/dev/null

          INFO="$(sips -g pixelWidth -g pixelHeight -g hasAlpha "$DECODED")"
          echo "$INFO"
          echo "$INFO" | grep -q "pixelWidth: 1024"
          echo "$INFO" | grep -q "pixelHeight: 1024"
          echo "$INFO" | grep -q "hasAlpha: no"

          # The app-icon background is intentionally the Orbit near-black.
          python3 - <<'PY'
          import struct
          import zlib

          path = "Orbit/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          data = open(path, "rb").read()
          assert data.startswith(b"\x89PNG\r\n\x1a\n")

          offset = 8
          idat = bytearray()
          saw_iend = False

          while offset < len(data):
              length = struct.unpack(">I", data[offset:offset + 4])[0]
              kind = data[offset + 4:offset + 8]
              payload = data[offset + 8:offset + 8 + length]
              crc = struct.unpack(
                  ">I",
                  data[offset + 8 + length:offset + 12 + length]
              )[0]

              assert len(payload) == length
              assert (
                  zlib.crc32(kind + payload) & 0xFFFFFFFF
              ) == crc

              if kind == b"IDAT":
                  idat.extend(payload)
              elif kind == b"IEND":
                  saw_iend = True
                  break

              offset += 12 + length

          assert saw_iend
          zlib.decompress(bytes(idat))
          PY

      - name: Select available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Using simulator $SIMULATOR_ID"

      - name: Build Orbit for testing
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run Orbit unit tests
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
          test-without-building

      - name: Build Orbit Release
        run: >
          xcodebuild
          -project Orbit.xcodeproj
          -scheme Orbit
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
